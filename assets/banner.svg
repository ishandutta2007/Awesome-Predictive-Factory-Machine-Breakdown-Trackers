<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="amberAlert" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="emeraldPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.01" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="slightGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Industrial Mesh / Grid Pattern -->
  <g stroke="url(#gridGlow)" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Radar / Sensor Pulse Rings (Left Accent) -->
  <g transform="translate(100, 210)" opacity="0.35">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#00f2fe" stroke-width="1.5">
      <animate attributeName="r" values="10;80;10" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#00f2fe" stroke-width="1">
      <animate attributeName="r" values="30;110;30" dur="4s" begin="1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0;0.6" dur="4s" begin="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="4" fill="#00f2fe" />
  </g>

  <!-- Dynamic Radar / Sensor Pulse Rings (Right Accent) -->
  <g transform="translate(1100, 210)" opacity="0.35">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#10b981" stroke-width="1.5">
      <animate attributeName="r" values="10;80;10" dur="4s" begin="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="4s" begin="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="4" fill="#10b981" />
  </g>

  <!-- Dynamic Ambient Vibration Telemetry Waves (Positioned Bottom Background) -->
  <g opacity="0.45" filter="url(#slightGlow)">
    <!-- Waveform 1: Cyan High Frequency Sensor Wave -->
    <path fill="none" stroke="url(#neonCyan)" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="d" dur="5s" repeatCount="indefinite"
        values="
          M0,350 Q75,320 150,350 T300,350 T450,350 T600,320 T750,370 T900,330 T1050,360 T1200,350;
          M0,350 Q75,370 150,340 T300,360 T450,330 T600,365 T750,330 T900,360 T1050,335 T1200,350;
          M0,350 Q75,320 150,350 T300,350 T450,350 T600,320 T750,370 T900,330 T1050,360 T1200,350
        " />
    </path>

    <!-- Waveform 2: Emerald Baseline Telemetry Wave -->
    <path fill="none" stroke="url(#emeraldPulse)" stroke-width="1.8" stroke-dasharray="4,4">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="
          M0,360 Q100,380 200,360 T400,360 T600,345 T800,375 T1000,355 T1200,360;
          M0,360 Q100,340 200,370 T400,350 T600,370 T800,345 T1000,365 T1200,360;
          M0,360 Q100,380 200,360 T400,360 T600,345 T800,375 T1000,355 T1200,360
        " />
    </path>
  </g>

  <!-- Animated Sensor Data Telemetry Packets (Moving on Bus Traces) -->
  <g>
    <line x1="80" y1="385" x2="1120" y2="385" stroke="#1e293b" stroke-width="2" />
    <circle r="4" fill="#00f2fe" filter="url(#glow)">
      <animate attributeName="cx" from="80" to="1120" dur="4s" repeatCount="indefinite" />
      <animate attributeName="cy" values="385;385" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#10b981" filter="url(#glow)">
      <animate attributeName="cx" from="1120" to="80" dur="5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="385;385" dur="5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Top Badges / Status Pills (Non-Obstructive Header Zone) -->
  <g transform="translate(600, 52)">
    <!-- Pill 1: IoT & Vibration Sensors -->
    <g transform="translate(-240, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#0f172a" stroke="#00f2fe" stroke-width="1" opacity="0.9" />
      <circle cx="-75" cy="0" r="4" fill="#00f2fe">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="5" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">VIBRATION &amp; ACOUSTIC</text>
    </g>

    <!-- Pill 2: AI Anomaly Detection -->
    <g transform="translate(0, 0)">
      <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" opacity="0.9" />
      <circle cx="-70" cy="0" r="4" fill="#a78bfa">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="5" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">AI FAULT DIAGNOSTICS</text>
    </g>

    <!-- Pill 3: ISO 10816 / 13374 Ready -->
    <g transform="translate(240, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1" opacity="0.9" />
      <circle cx="-75" cy="0" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="5" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">RUL PREDICTION (PdM)</text>
    </g>
  </g>

  <!-- FOREGROUND BRANDING & TITLE (Always in Front, Unhidden, Pristine Contrast) -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <!-- Sub-heading Tagline -->
    <text y="-25" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="3" text-transform="uppercase">
      INDUSTRIAL IOT • CONDITION MONITORING • ASSET HEALTH
    </text>

    <!-- Main Title -->
    <text y="30" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      Predictive Factory Machine
    </text>
    <text y="78" fill="url(#neonCyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" filter="url(#slightGlow)">
      Breakdown Trackers
    </text>

    <!-- Subtitle -->
    <text y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="0.2">
      Curated List of SaaS Platforms &amp; Open-Source Projects for Vibration Analysis &amp; Failure Prevention
    </text>
  </g>

  <!-- Metric Badges Row (Bottom Accent Cards) -->
  <g transform="translate(600, 325)">
    <!-- Zero Downtime -->
    <g transform="translate(-250, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Real-Time Telemetry</text>
    </g>
    <!-- RUL Prediction -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🧠 Machine Learning Models</text>
    </g>
    <!-- Open Standards -->
    <g transform="translate(250, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛡️ ISO 10816 / ISO 13374</text>
    </g>
  </g>
</svg>
